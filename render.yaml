services:
  - type: web
    name: creative-survey
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      # Set this in the Render dashboard (Environment tab), NOT here.
      # A connection string is a credential and must not be committed.
      - key: DATABASE_URL
        sync: false
